services:
  quantumbotx:
    build: .
    container_name: quantumbotx_bot
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ./instance:/app/instance # Persist database (SQLite)
      - ./logs:/app/logs # Persist trade logs
    env_file:
      - .env # Gunakan konfigurasi terpusat dari .env Anda
    environment:
      - FLASK_ENV=development
      - BROKER_TYPE=CCXT
      - EXCHANGE_ID=binance
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
